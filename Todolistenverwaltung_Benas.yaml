openapi: 3.0.1
info:
  title: Todo-Listen-Verwaltung
  version: 1.0.0
  description: REST-Schnittstelle zur Verwaltung von Todo-Listen und deren Einträgen.
  contact:
    email: simanaviciusbenas12@gmail.com
servers:
  - url: http://127.0.0.1:5000/

tags:
  - name: Listenverwaltung
  - name: Eintragsverwaltung

paths:

  /todo-list:
    get:
      tags: [Listenverwaltung]
      summary: Liefert alle Todo-Listen zurück
      operationId: getAllLists
      responses:
        "200":
          description: Liste aller Listen
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TodoList'

    post:
      tags: [Listenverwaltung]
      summary: Fügt eine neue Todo-Liste hinzu
      operationId: addList
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "201":
          description: Liste erfolgreich erstellt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoList'
        "400":
          description: Ungültiger Request-Body

  /todo-list/{list_id}:
    get:
      tags: [Listenverwaltung]
      summary: Liefert alle Einträge einer Todo-Liste zurück
      parameters:
        - name: list_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Erfolgreich abgerufen
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TodoEntry'
        "404":
          description: Liste nicht gefunden

    delete:
      tags: [Listenverwaltung]
      summary: Löscht eine komplette Todo-Liste
      parameters:
        - name: list_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Erfolgreich gelöscht
        "404":
          description: Liste nicht gefunden

    post:
      tags: [Eintragsverwaltung]
      summary: Fügt einen Eintrag zu einer bestehenden Liste hinzu
      parameters:
        - name: list_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required: [name, description]
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        "201":
          description: Eintrag erfolgreich erstellt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoEntry'
        "400":
          description: Ungültiger Request-Body
        "404":
          description: Liste nicht gefunden

  /todo-list/entry/{entry_id}:
    patch:
      tags: [Eintragsverwaltung]
      summary: Aktualisiert einen bestehenden Eintrag
      parameters:
        - name: entry_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        "200":
          description: Eintrag erfolgreich aktualisiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoEntry'
        "400":
          description: Ungültiger Body
        "404":
          description: Eintrag nicht gefunden

    delete:
      tags: [Eintragsverwaltung]
      summary: Löscht einen einzelnen Eintrag
      parameters:
        - name: entry_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Erfolgreich gelöscht
        "404":
          description: Eintrag nicht gefunden

components:
  schemas:
    TodoList:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    TodoEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        list_id:
          type: string
          format: uuid